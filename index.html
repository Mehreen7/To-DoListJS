<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-container">

        <header class="todo-header">
            <h1>Ma To-Do List</h1>
            <div class="filter-container">
                <button id="filterBtn">Filtres ▼</button>
                <ul id="filterOptions" class="hidden">
                    <li data-filter="all">Tout</li>
                    <li data-filter="inProgress">
                        <span class="filter-icon icon-inProgress"></span>
                        En cours</li>
                    <li data-filter="done">
                        <span class="filter-icon icon-done"></span>
                        Finis</li>
                </ul>
            </div>
        </header>

        <section id="taskList" class="todo-list">

        </section>
        <div class="legend">
            <p>
                <span class="legend-item">
                    <span class="legend-icon icon-todo"></span>
                    : tâches à faire
                </span>
                <br>
                <span class="legend-item">
                    <span class="legend-icon icon-inProgress"></span>
                    : tâches en cours
                </span>
                <br>
                <span class="legend-item">
                    <span class="legend-icon icon-done"></span>
                    : tâches terminées
                </span>
            </p>
        </div>
        <footer class="todo-input">
            <button id="addTaskBtn">➕</button>
            <input type="text" id="taskInput" placeholder="Nouvelle tâche...">
        </footer>

    </div>
    <script src="script.js"></script>
</body>

</html>
