<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="todo-header">
        <h1>Ma To-Do List</h1>
        <div class="filter-container">
            <button id="filterBtn">▼</button>
            <ul id="filterOptions" class="hidden">
                <li data-filter="all">Tout</li>
                <li data-filter="inProgress">En cours</li>
                <li data-filter="done">Finis</li>
            </ul>
        </div>
    </header>

    <section id="taskList" class="todo-list">
        <!-- Les tâches seront créées par JS ici -->
        <!-- Exemple structure d’une tâche -->
        <!--
  <div class="task-item">
    <input type="checkbox" class="task-checkbox">
    <span class="task-text">Faire les courses</span>
    <button class="status-btn" data-status="todo">🟢</button>
    <button class="delete-btn">🗑️</button>
  </div>
  -->
    </section>

    <footer class="todo-input">
        <button id="addTaskBtn">➕</button>
        <input type="text" id="taskInput" placeholder="Nouvelle tâche...">
    </footer>

    <script src="script.js"></script>
</body>

</html>
